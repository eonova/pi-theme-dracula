<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="pi-plugin-chrome" content="v2" />
    <title>Dracula Theme</title>
    <style>
      :root {
        color-scheme: dark;
        /* Dracula palette */
        --bg: #282a36;
        --surface: #343746;
        --surface-hover: color-mix(in oklab, #bd93f9 12%, transparent);
        --fg: #f8f8f2;
        --muted: color-mix(in oklab, #f8f8f2 55%, #282a36);
        --border: color-mix(in oklab, #bd93f9 25%, transparent);
        --accent: #bd93f9;
        --accent-fg: #282a36;
        --selection: #44475a;
        --cyan: #8be9fd;
        --green: #50fa7b;
        --orange: #ffb86c;
        --pink: #ff79c6;
        --red: #ff5555;
        --yellow: #f1fa8c;
      }
      :root[data-base="light"] {
        color-scheme: light;
        /* Dracula Pro Light-ish: keep the same hues on a pale base */
        --bg: #f8f8f2;
        --surface: #ffffff;
        --surface-hover: color-mix(in oklab, #bd93f9 12%, transparent);
        --fg: #282a36;
        --muted: #6272a4;
        --border: color-mix(in oklab, #6272a4 30%, transparent);
        --accent: #bd93f9;
        --accent-fg: #282a36;
        --selection: #e6e6f0;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        padding: var(--pi-plugin-titlebar-height, 0px) 16px 16px;
        overflow: auto;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      /*
       * PI-Desktop reserves exactly a transparent 46px drag band and overlays
       * only the host-owned three-button capsule. The visible panel header belongs
       * to the plugin. Development panels show a reminder that this
       * band is not clickable outside the capsule. For fixed/sticky top UI,
       * use top: var(--pi-plugin-titlebar-height, 46px).
       */
      .card {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        background: var(--surface);
      }
      h2 {
        margin: 0 0 4px;
        font-size: 16px;
        font-weight: 560;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      button {
        margin-top: 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 12px;
        background: var(--accent);
        color: var(--accent-fg);
        cursor: pointer;
        font: inherit;
        transition: opacity 150ms ease;
      }
      button:hover { opacity: 0.82; }
      button:focus-visible {
        outline: 2px solid color-mix(in oklab, var(--accent) 58%, transparent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2 id="panel-title"></h2>
      <p id="panel-subtitle"></p>
      <button id="ping"></button>
    </div>
    <script>
      const COPY = {
        en: {
          title: "Dracula Theme",
          subtitle: "Panel served from this plugin's renderer directory.",
          ping: "Toast ping",
          toast: "Dracula Theme panel bridge"
        },
        "zh-CN": {
          title: "德古拉主题",
          subtitle: "面板由本插件的 renderer 目录提供。",
          ping: "测试通知",
          toast: "德古拉主题面板桥接已接通"
        }
      };
      const pickCopy = (locale) =>
        COPY[locale] ||
        COPY[String(locale || "").toLowerCase().startsWith("zh") ? "zh-CN" : "en"] ||
        COPY.en;
      const setText = (id, value) => {
        const el = document.getElementById(id);
        if (el) el.textContent = value;
      };
      const applyCopy = (appearance) => {
        const copy = pickCopy(appearance?.locale);
        setText("panel-title", copy.title);
        setText("panel-subtitle", copy.subtitle);
        setText("ping", copy.ping);
        window.__draculaToast = copy.toast;
      };
      const applyAppearance = (appearance) => {
        const base = appearance?.base;
        document.documentElement.dataset.base = base === "light" || base === "dark"
          ? base
          : window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        if (typeof appearance?.locale === "string" && appearance.locale) {
          document.documentElement.lang = appearance.locale;
        }
        applyCopy(appearance);
      };
      window.pluginBridge?.on("appearance:changed", applyAppearance);
      window.pluginBridge?.invoke("app.getAppearance").then(applyAppearance).catch(() => applyAppearance(null));
      document.getElementById("ping").addEventListener("click", async () => {
        if (window.pluginBridge?.invoke) {
          await window.pluginBridge.invoke("ui.showToast", {
            message: window.__draculaToast || "Dracula Theme panel bridge",
          });
        } else {
          alert("pluginBridge is unavailable outside PI-Desktop");
        }
      });
    </script>
  </body>
</html>
